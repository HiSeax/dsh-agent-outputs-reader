# One package, two halves: the patch inserts the single plugin row that mounts
# the host half (loopback-only file/tree/raw/beacon routes for reading agent
# output files) and lets the browser half be discovered through the package.json
# `dsh.client` declaration (lib/client.js: reader overlay + reply-end file chips).
#
# Install: dsh plugin --profile <name> add @dsh-external/dsh-agent-outputs-reader

- insert:
    - id: agent-outputs-reader
      name: '@dsh-external/dsh-agent-outputs-reader'
